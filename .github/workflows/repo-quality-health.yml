name: Repo Quality Health

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  repo-quality-health:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run repo quality health gate
        run: python run.py --run-repo-quality-health
